<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Berkas Calon Karyawan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-red-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user-check text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Portal Reminder Berkas Recruitment</h1>
            </div>
            <span class="bg-red-700 text-xs px-3 py-1 rounded-full border border-red-500">Recruitment Team</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Banner Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 border-l-4 border-l-amber-500">
                <p class="text-sm text-slate-500 font-medium">Pending Berkas</p>
                <p class="text-2xl font-bold text-slate-800" id="stat-pending">3 Orang</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 border-l-4 border-l-green-500">
                <p class="text-sm text-slate-500 font-medium">Berkas Lengkap</p>
                <p class="text-2xl font-bold text-slate-800" id="stat-complete">1 Orang</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
                <p class="text-sm text-slate-500 font-medium">Total Calon Karyawan</p>
                <p class="text-2xl font-bold text-slate-800" id="stat-total">4 Orang</p>
            </div>
        </div>

        <!-- Filter & Actions Bar -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 justify-between items-center">
            <div class="flex gap-2 items-center w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="Cari nama atau email..." onkeyup="filterData()" class="px-3 py-2 border border-slate-300 rounded-md text-sm w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-red-500">
                <select id="statusFilter" onchange="filterData()" class="px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                    <option value="ALL">Semua Status</option>
                    <option value="PENDING" selected>Berkas Belum Lengkap</option>
                    <option value="COMPLETE">Berkas Lengkap</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button onclick="sendSelectedEmails()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-md font-medium flex items-center gap-2 transition shadow-sm">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Reminder Terpilih
                </button>
            </div>
        </div>

        <!-- Table Data Candidate -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-semibold tracking-wider">
                        <tr>
                            <th class="p-4 w-10">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                            </th>
                            <th class="p-4">Nama Candidate</th>
                            <th class="p-4">Posisi</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Kekurangan Berkas</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="candidateTableBody" class="divide-y divide-slate-200">
                        <!-- Data dimasukkan secara dinamis via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- JavaScript Script -->
    <script>
        // Sample Data berdasarkan data proses rekrutmen/kelulusan crew
        const candidates = [
            {
                id: 1,
                nama: "Ahmad Rizky",
                posisi: "Crew Store",
                email: "ahmad.rizky@example.com",
                berkasBelum: ["FC Ijazah Legalisir", "SKCK Aktif"],
                status: "PENDING"
            },
            {
                id: 2,
                nama: "Siti Rahmawati",
                posisi: "DC Crew",
                email: "siti.rahmawati@example.com",
                berkasBelum: ["Pas Foto 4x6 Red Background", "Surat Keterangan Sehat"],
                status: "PENDING"
            },
            {
                id: 3,
                nama: "Budi Santoso",
                posisi: "Crew Store",
                email: "budi.santoso@example.com",
                berkasBelum: ["FC Kartu Keluarga", "FC KTP"],
                status: "PENDING"
            },
            {
                id: 4,
                nama: "Dewi Lestari",
                posisi: "DC Crew",
                email: "dewi.lestari@example.com",
                berkasBelum: [],
                status: "COMPLETE"
            }
        ];

        // Render Data ke Tabel
        function renderTable(data) {
            const tbody = document.getElementById('candidateTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-slate-400">Tidak ada data candidate ditemukan</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                
                const missingBadges = item.berkasBelum.length > 0 
                    ? item.berkasBelum.map(b => `<span class="bg-amber-100 text-amber-800 text-xs font-medium px-2 py-0.5 rounded border border-amber-200 inline-block mr-1 mb-1">${b}</span>`).join('') 
                    : `<span class="text-slate-400 text-xs italic">Tidak ada (Lengkap)</span>`;

                const statusBadge = item.status === 'PENDING'
                    ? `<span class="bg-red-100 text-red-700 text-xs font-semibold px-2.5 py-1 rounded-full">Belum Lengkap</span>`
                    : `<span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">Lengkap</span>`;

                const checkboxDisabled = item.status === 'COMPLETE' ? 'disabled' : '';

                tr.innerHTML = `
                    <td class="p-4">
                        <input type="checkbox" class="candidate-select" value="${item.id}" ${checkboxDisabled}>
                    </td>
                    <td class="p-4 font-semibold text-slate-800">${item.nama}</td>
                    <td class="p-4">${item.posisi}</td>
                    <td class="p-4">${item.email}</td>
                    <td class="p-4">${missingBadges}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-center">
                        ${item.status === 'PENDING' ? `
                            <button onclick="sendSingleEmail(${item.id})" title="Kirim Email" class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-md text-xs font-medium border border-blue-200 transition">
                                <i class="fa-solid fa-envelope mr-1"></i> Email
                            </button>
                        ` : `-`}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateStatistics();
        }

        // Template Generator Email
        function generateEmailContent(candidate) {
            const subject = encodeURIComponent(`[REMINDER REKRUTMEN] Kelengkapan Berkas Calon Karyawan - ${candidate.nama}`);
            const listBerkas = candidate.berkasBelum.map((b, i) => `${i + 1}. ${b}`).join('%0D%0A');
            
            const body = encodeURIComponent(
`Halo ${candidate.nama},

Selamat, Anda telah melampaui tahapan seleksi rekrutmen kami untuk posisi ${candidate.posisi}.

Guna melanjutkan ke proses verifikasi dan administrasi selanjutnya, kami menginformasikan bahwa masih terdapat dokumen/berkas Anda yang belum lengkap:

${candidate.berkasBelum.map((b, i) => `${i + 1}.${b}`).join('\n')}

Mohon untuk dapat melengkapi dan mengirimkan ulang balasan email ini beserta lampiran berkas di atas paling lambat dalam kurun waktu 2x24 jam.

Jika ada pertanyaan, silakan hubungi Tim Recruitment.

Salam,
Tim Recruitment`
            );

            return `mailto:${candidate.email}?subject=${subject}&body=${body}`;
        }

        // Kirim Tunggal
        function sendSingleEmail(id) {
            const candidate = candidates.find(c => c.id === id);
            if (candidate) {
                window.location.href = generateEmailContent(candidate);
            }
        }

        // Kirim Terpilih (Membuka mailto satu per satu)
        function sendSelectedEmails() {
            const checkboxes = document.querySelectorAll('.candidate-select:checked');
            if (checkboxes.length === 0) {
                alert('Pilih setidaknya satu candidate berkas belum lengkap.');
                return;
            }

            checkboxes.forEach((cb, index) => {
                const candidate = candidates.find(c => c.id == cb.value);
                if (candidate) {
                    setTimeout(() => {
                        window.open(generateEmailContent(candidate), '_blank');
                    }, index * 800); // jeda agar browser tidak memblokir popup
                }
            });
        }

        // Toggle Select All Checkbox
        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('.candidate-select:not([disabled])');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        // Filter Function
        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const statusValue = document.getElementById('statusFilter').value;

            const filtered = candidates.filter(item => {
                const matchesSearch = item.nama.toLowerCase().includes(searchValue) || item.email.toLowerCase().includes(searchValue);
                const matchesStatus = statusValue === 'ALL' || item.status === statusValue;
                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        }

        // Dynamic Statistics
        function updateStatistics() {
            const pending = candidates.filter(c => c.status === 'PENDING').length;
            const complete = candidates.filter(c => c.status === 'COMPLETE').length;
            
            document.getElementById('stat-pending').innerText = `${pending} Orang`;
            document.getElementById('stat-complete').innerText = `${complete} Orang`;
            document.getElementById('stat-total').innerText = `${candidates.length} Orang`;
        }

        // Initial Render
        filterData();
    </script>
</body>
</html>
